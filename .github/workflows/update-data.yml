name: update-data

# 매일 한국시간 17:00 (= UTC 08:00). 미국장은 한국시간 새벽에 끝나므로 전일 미국장 데이터가 반영됨.
# main에 코드가 바뀌어도 바로 다시 만들어 배포.
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 데이터 갱신
        run: python update_data.py

      # deploy 브랜치 = main 코드 + 최신 데이터. 매번 커밋 1개로 덮어써서 저장소가 커지지 않게 함.
      # Streamlit Community Cloud는 이 브랜치를 배포하고, 푸시되면 자동으로 다시 시작함.
      - name: deploy 브랜치에 올리기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan deploy
          git add -A
          git add -f data
          git commit -m "deploy: 기준일 $(jq -r .last_bar_date data/meta.json)"
          git push -f origin deploy
